# The address the Home Assistant integration talks to, and the one this app
# sends out in its discovery message.
#
# It is plain HTTP on purpose, whatever the "ssl" option says. The port is not
# one Home Assistant can publish, so only the internal network can reach it
# and the traffic never leaves the machine. A certificate would add nothing
# there, and would actively get in the way: it is made out for the domain the
# direct port is reached at, and Home Assistant verifies the one it is offered
# against this app's hostname, which is never the same name.
server {
    listen 9001 default_server;

    include /etc/nginx/includes/server_params.conf;
    include /etc/nginx/includes/proxy_params.conf;

    proxy_redirect off;

    # Served from the root here, so none of the Ingress rewriting applies and
    # Mealie's own login screen is what guards it.
    location / {
        proxy_pass http://backend;
    }
}
